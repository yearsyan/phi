name: Build daemon binaries

on:
  push:
    tags:
      - "v**"

permissions:
  contents: read

concurrency:
  group: daemon-releases-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  macos-arm64:
    name: Signed and notarized macOS ARM64
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # web/dist is embedded into the daemon binary at compile time; build it
      # before cargo so release binaries serve the real web client instead of
      # the build.rs placeholder page.
      - name: Build embedded web client
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build phi-daemon
        run: cargo +stable build --locked --release --package phi-daemon --bin phi-daemon

      - name: Prepare executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/phi-daemon dist/phi-daemon
          chmod 755 dist/phi-daemon
          architectures="$(lipo -archs dist/phi-daemon)"
          [[ "$architectures" == "arm64" ]]

      - name: Check Apple signing configuration
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          : "${MACOS_CERTIFICATE_P12_BASE64:?missing macOS Developer ID certificate}"
          : "${MACOS_CERTIFICATE_PASSWORD:?missing macOS certificate password}"
          : "${APPLE_API_KEY_P8_BASE64:?missing App Store Connect API key}"
          : "${APPLE_API_KEY_ID:?missing App Store Connect API key ID}"
          : "${APPLE_API_ISSUER_ID:?missing App Store Connect API issuer ID}"

      - name: Import Developer ID certificate
        uses: Apple-Actions/import-codesign-certs@v7.0.0
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      - name: Sign executable with Developer ID
        shell: bash
        run: |
          set -euo pipefail
          signing_identity="$(
            security find-identity -v -p codesigning \
              | awk '/Developer ID Application/ { print $2; exit }'
          )"
          if [[ -z "$signing_identity" ]]; then
            echo "::error::The PKCS#12 secret does not contain a Developer ID Application identity."
            exit 1
          fi

          codesign \
            --force \
            --options runtime \
            --timestamp \
            --sign "$signing_identity" \
            dist/phi-daemon
          codesign --verify --strict --verbose=2 dist/phi-daemon

      - name: Verify executable
        shell: bash
        run: |
          set -euo pipefail
          file dist/phi-daemon
          lipo -archs dist/phi-daemon
          vtool -show-build dist/phi-daemon
          otool -L dist/phi-daemon
          codesign --verify --strict --verbose=2 dist/phi-daemon

      - name: Package executable
        shell: bash
        run: |
          set -euo pipefail
          ditto -c -k \
            dist/phi-daemon \
            dist/phi-daemon-macos-arm64.zip

      - name: Notarize executable
        shell: bash
        env:
          PACKAGE_PATH: dist/phi-daemon-macos-arm64.zip
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          notary_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          cleanup() {
            rm -f "$notary_key_path"
          }
          trap cleanup EXIT

          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 -D > "$notary_key_path"
          chmod 600 "$notary_key_path"
          # `notarytool --wait` fails unless Apple accepts the upload. Do not
          # run `spctl` here: it rejects a valid standalone CLI as "not an app".
          xcrun notarytool submit "$PACKAGE_PATH" \
            --key "$notary_key_path" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: phi-daemon-macos-arm64.zip
          path: dist/phi-daemon-macos-arm64.zip
          if-no-files-found: error
          archive: false

  windows-x86-64:
    name: Windows x86_64
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # web/dist is embedded into the daemon binary at compile time; build it
      # before cargo so release binaries serve the real web client instead of
      # the build.rs placeholder page.
      - name: Build embedded web client
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build phi-daemon
        run: cargo +stable build --locked --release --package phi-daemon --bin phi-daemon

      - name: Package executable
        shell: pwsh
        run: >-
          Compress-Archive
          -LiteralPath target/release/phi-daemon.exe
          -DestinationPath phi-daemon-windows-x86_64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: phi-daemon-windows-x86_64.zip
          path: phi-daemon-windows-x86_64.zip
          if-no-files-found: error
          archive: false

  linux:
    name: Linux ${{ matrix.archive_arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            archive_arch: x86_64
            machine_arch: x86_64
          - runner: ubuntu-24.04-arm
            archive_arch: arm64
            machine_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # web/dist is embedded into the daemon binary at compile time; build it
      # before cargo so release binaries serve the real web client instead of
      # the build.rs placeholder page.
      - name: Build embedded web client
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build phi-daemon
        run: cargo +stable build --locked --release --package phi-daemon --bin phi-daemon

      - name: Verify executable architecture
        shell: bash
        env:
          EXPECTED_MACHINE_ARCH: ${{ matrix.machine_arch }}
        run: |
          set -euo pipefail
          actual_machine_arch="$(uname -m)"
          [[ "$actual_machine_arch" == "$EXPECTED_MACHINE_ARCH" ]]
          file target/release/phi-daemon

      - name: Package executable
        shell: bash
        env:
          ARCHIVE_ARCH: ${{ matrix.archive_arch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -j \
            "dist/phi-daemon-linux-${ARCHIVE_ARCH}.zip" \
            target/release/phi-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: phi-daemon-linux-${{ matrix.archive_arch }}.zip
          path: dist/phi-daemon-linux-${{ matrix.archive_arch }}.zip
          if-no-files-found: error
          archive: false

  github-release:
    name: Publish GitHub Release assets
    if: github.ref_type == 'tag'
    needs:
      - macos-arm64
      - windows-x86-64
      - linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Download macOS ARM64 archive
        uses: actions/download-artifact@v8
        with:
          name: phi-daemon-macos-arm64.zip
          path: dist
          skip-decompress: true

      - name: Download Windows x86_64 archive
        uses: actions/download-artifact@v8
        with:
          name: phi-daemon-windows-x86_64.zip
          path: dist
          skip-decompress: true

      - name: Download Linux x86_64 archive
        uses: actions/download-artifact@v8
        with:
          name: phi-daemon-linux-x86_64.zip
          path: dist
          skip-decompress: true

      - name: Download Linux ARM64 archive
        uses: actions/download-artifact@v8
        with:
          name: phi-daemon-linux-arm64.zip
          path: dist
          skip-decompress: true

      - name: Publish release assets
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(
            dist/phi-daemon-macos-arm64.zip
            dist/phi-daemon-windows-x86_64.zip
            dist/phi-daemon-linux-x86_64.zip
            dist/phi-daemon-linux-arm64.zip
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi
