name: Build client releases

on:
  push:
    branches:
      - "**"
    tags:
      - "v**"

permissions:
  contents: read

concurrency:
  group: client-releases-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-release:
    name: Signed Android ARM64 release APK
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            flutter/android/**/*.gradle*
            flutter/android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      - name: Install Flutter dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Build signed release APK
        working-directory: flutter
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/phi-android-release.jks
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_RELEASE_KEYSTORE_BASE64:?missing Android release keystore}"
          : "${ANDROID_RELEASE_STORE_PASSWORD:?missing Android release store password}"
          : "${ANDROID_RELEASE_KEY_ALIAS:?missing Android release key alias}"
          : "${ANDROID_RELEASE_KEY_PASSWORD:?missing Android release key password}"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" \
            | base64 --decode > "$ANDROID_RELEASE_KEYSTORE_PATH"
          chmod 600 "$ANDROID_RELEASE_KEYSTORE_PATH"
          flutter build apk --release --target-platform android-arm64
          mv build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/phi-client-android-release.apk

      - name: Verify APK ABI
        working-directory: flutter
        shell: bash
        run: |
          set -euo pipefail
          apk_path=build/app/outputs/flutter-apk/phi-client-android-release.apk
          mapfile -t packaged_abis < <(
            unzip -Z1 "$apk_path" \
              | sed -n 's#^lib/\([^/]*\)/.*\.so$#\1#p' \
              | sort -u
          )
          if [[ "${#packaged_abis[@]}" -ne 1 || "${packaged_abis[0]}" != "arm64-v8a" ]]; then
            printf 'Expected only arm64-v8a native libraries, found: %s\n' \
              "${packaged_abis[*]:-none}" >&2
            exit 1
          fi

      - name: Verify APK signature
        working-directory: flutter
        shell: bash
        run: |
          set -euo pipefail
          build_tools_version="$(ls -1 "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -n 1)"
          "$ANDROID_SDK_ROOT/build-tools/$build_tools_version/apksigner" verify \
            --verbose \
            --print-certs \
            build/app/outputs/flutter-apk/phi-client-android-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: phi-client-android-release.apk
          path: flutter/build/app/outputs/flutter-apk/phi-client-android-release.apk
          if-no-files-found: error
          archive: false

  windows-release:
    name: Windows x64 release bundle
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Enable long Git paths
        run: git config --global core.longpaths true

      - name: Install Flutter dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Build Windows release
        working-directory: flutter
        run: flutter build windows --release

      - name: Package Windows release bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundlePath = "flutter/build/windows/x64/runner/Release"
          $executablePath = Join-Path $bundlePath "phi_client.exe"
          if (-not (Test-Path -LiteralPath $executablePath -PathType Leaf)) {
            throw "Expected Windows executable was not built: $executablePath"
          }
          Compress-Archive `
            -Path "$bundlePath/*" `
            -DestinationPath "phi-client-windows-x64.zip"

      - name: Upload Windows release bundle
        uses: actions/upload-artifact@v7
        with:
          name: phi-client-windows-x64.zip
          path: phi-client-windows-x64.zip
          if-no-files-found: error
          archive: false

  github-release:
    name: Publish GitHub Release assets
    if: github.ref_type == 'tag'
    needs:
      - android-release
      - windows-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Android release APK
        uses: actions/download-artifact@v8
        with:
          name: phi-client-android-release.apk
          path: dist
          skip-decompress: true

      - name: Download Windows release bundle
        uses: actions/download-artifact@v8
        with:
          name: phi-client-windows-x64.zip
          path: dist
          skip-decompress: true

      - name: Publish release assets
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(
            dist/phi-client-android-release.apk
            dist/phi-client-windows-x64.zip
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi
