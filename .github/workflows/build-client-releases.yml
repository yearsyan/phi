name: Build client releases

on:
  push:
    tags:
      - "v**"

permissions:
  contents: read

concurrency:
  group: client-releases-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-release:
    name: Signed Android ARM64 release APK
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            flutter/android/**/*.gradle*
            flutter/android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      - name: Install Flutter dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Build signed release APK
        working-directory: flutter
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/phi-android-release.jks
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_RELEASE_KEYSTORE_BASE64:?missing Android release keystore}"
          : "${ANDROID_RELEASE_STORE_PASSWORD:?missing Android release store password}"
          : "${ANDROID_RELEASE_KEY_ALIAS:?missing Android release key alias}"
          : "${ANDROID_RELEASE_KEY_PASSWORD:?missing Android release key password}"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" \
            | base64 --decode > "$ANDROID_RELEASE_KEYSTORE_PATH"
          chmod 600 "$ANDROID_RELEASE_KEYSTORE_PATH"
          flutter build apk --release --target-platform android-arm64
          mv build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/phi-client-android-release.apk

      - name: Verify APK ABI
        working-directory: flutter
        shell: bash
        run: |
          set -euo pipefail
          apk_path=build/app/outputs/flutter-apk/phi-client-android-release.apk
          mapfile -t packaged_abis < <(
            unzip -Z1 "$apk_path" \
              | sed -n 's#^lib/\([^/]*\)/.*\.so$#\1#p' \
              | sort -u
          )
          if [[ "${#packaged_abis[@]}" -ne 1 || "${packaged_abis[0]}" != "arm64-v8a" ]]; then
            printf 'Expected only arm64-v8a native libraries, found: %s\n' \
              "${packaged_abis[*]:-none}" >&2
            exit 1
          fi

      - name: Verify APK signature
        working-directory: flutter
        shell: bash
        run: |
          set -euo pipefail
          build_tools_version="$(ls -1 "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -n 1)"
          "$ANDROID_SDK_ROOT/build-tools/$build_tools_version/apksigner" verify \
            --verbose \
            --print-certs \
            build/app/outputs/flutter-apk/phi-client-android-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: phi-client-android-release.apk
          path: flutter/build/app/outputs/flutter-apk/phi-client-android-release.apk
          if-no-files-found: error
          archive: false

  windows-release:
    name: Windows x64 release bundle
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Enable long Git paths
        run: git config --global core.longpaths true

      - name: Install Flutter dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Build Windows release
        working-directory: flutter
        run: flutter build windows --release

      - name: Package Windows release bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundlePath = "flutter/build/windows/x64/runner/Release"
          $executablePath = Join-Path $bundlePath "phi_client.exe"
          if (-not (Test-Path -LiteralPath $executablePath -PathType Leaf)) {
            throw "Expected Windows executable was not built: $executablePath"
          }
          Compress-Archive `
            -Path "$bundlePath/*" `
            -DestinationPath "phi-client-windows-x64.zip"

      - name: Upload Windows release bundle
        uses: actions/upload-artifact@v7
        with:
          name: phi-client-windows-x64.zip
          path: phi-client-windows-x64.zip
          if-no-files-found: error
          archive: false

  macos-release:
    name: Signed and notarized macOS universal DMG
    if: github.ref_type == 'tag'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check Apple signing configuration
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          : "${MACOS_CERTIFICATE_P12_BASE64:?missing macOS Developer ID certificate}"
          : "${MACOS_CERTIFICATE_PASSWORD:?missing macOS certificate password}"
          : "${APPLE_API_KEY_P8_BASE64:?missing App Store Connect API key}"
          : "${APPLE_API_KEY_ID:?missing App Store Connect API key ID}"
          : "${APPLE_API_ISSUER_ID:?missing App Store Connect API issuer ID}"

      - name: Import Developer ID certificate
        uses: Apple-Actions/import-codesign-certs@v7.0.0
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Install Flutter dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Build macOS release
        working-directory: flutter
        run: flutter build macos --release

      - name: Sign app and create DMG
        shell: bash
        run: |
          set -euo pipefail
          app_path="flutter/build/macos/Build/Products/Release/phi_client.app"
          app_executable="$app_path/Contents/MacOS/phi_client"
          entitlements_path="flutter/macos/Runner/Release.entitlements"
          dmg_path="$GITHUB_WORKSPACE/phi-client-macos.dmg"
          staging_path="$RUNNER_TEMP/phi-client-dmg"

          cleanup() {
            rm -rf "$staging_path"
          }
          trap cleanup EXIT

          [[ -d "$app_path" ]]
          [[ -x "$app_executable" ]]
          [[ -f "$entitlements_path" ]]
          architectures="$(lipo -archs "$app_executable")"
          for required_architecture in arm64 x86_64; do
            if [[ " $architectures " != *" $required_architecture "* ]]; then
              echo "::error::Expected a universal macOS app; found architectures: $architectures"
              exit 1
            fi
          done

          signing_identity="$(
            security find-identity -v -p codesigning \
              | awk '/Developer ID Application/ { print $2; exit }'
          )"
          if [[ -z "$signing_identity" ]]; then
            echo "::error::The PKCS#12 secret does not contain a Developer ID Application identity."
            exit 1
          fi

          while IFS= read -r nested_code; do
            codesign \
              --force \
              --options runtime \
              --timestamp \
              --sign "$signing_identity" \
              "$nested_code"
          done < <(
            find "$app_path/Contents" -depth \
              \( \
                -type d \
                \( \
                  -name '*.app' \
                  -o -name '*.appex' \
                  -o -name '*.framework' \
                  -o -name '*.xpc' \
                \) \
                -o -type f \
                \( -name '*.dylib' -o -name '*.so' \) \
              \) \
              -print
          )

          codesign \
            --force \
            --options runtime \
            --timestamp \
            --entitlements "$entitlements_path" \
            --sign "$signing_identity" \
            "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"

          mkdir -p "$staging_path"
          ditto "$app_path" "$staging_path/phi_client.app"
          ln -s /Applications "$staging_path/Applications"
          hdiutil create \
            -volname "Phi Client" \
            -srcfolder "$staging_path" \
            -ov \
            -format UDZO \
            "$dmg_path"
          codesign \
            --force \
            --timestamp \
            --sign "$signing_identity" \
            "$dmg_path"
          codesign --verify --strict --verbose=2 "$dmg_path"

      - name: Notarize and staple DMG
        shell: bash
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          dmg_path="phi-client-macos.dmg"
          notary_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"

          cleanup() {
            rm -f "$notary_key_path"
          }
          trap cleanup EXIT

          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 -D > "$notary_key_path"
          chmod 600 "$notary_key_path"
          xcrun notarytool submit "$dmg_path" \
            --key "$notary_key_path" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$dmg_path"
          xcrun stapler validate "$dmg_path"
          spctl --assess \
            --type open \
            --context context:primary-signature \
            --verbose=4 \
            "$dmg_path"

      - name: Upload macOS release DMG
        uses: actions/upload-artifact@v7
        with:
          name: phi-client-macos.dmg
          path: phi-client-macos.dmg
          if-no-files-found: error
          archive: false

  github-release:
    name: Publish GitHub Release assets
    if: github.ref_type == 'tag'
    needs:
      - android-release
      - macos-release
      - windows-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Android release APK
        uses: actions/download-artifact@v8
        with:
          name: phi-client-android-release.apk
          path: dist
          skip-decompress: true

      - name: Download Windows release bundle
        uses: actions/download-artifact@v8
        with:
          name: phi-client-windows-x64.zip
          path: dist
          skip-decompress: true

      - name: Download macOS release DMG
        uses: actions/download-artifact@v8
        with:
          name: phi-client-macos.dmg
          path: dist
          skip-decompress: true

      - name: Publish release assets
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(
            dist/phi-client-android-release.apk
            dist/phi-client-macos.dmg
            dist/phi-client-windows-x64.zip
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi
